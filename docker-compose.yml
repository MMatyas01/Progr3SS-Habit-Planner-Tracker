version: '3.8'

services:
  backend:
    build:
      context: .
    ports:
      - '8080:8080'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      AT_SECRET: "my-super-secret-at-key-for-lab7-1234567890"
      RT_SECRET: "my-super-secret-rt-key-for-lab7-1234567890"
      
      # A NestJS kódod által várt TypeORM változók:
      PG_HOST: db
      PG_PORT: 5432
      PG_USERNAME: user
      PG_PASSWORD: password
      PG_DATABASE: dbname
      
      # Redis kapcsolat (ezt a kód is így várja):
      REDIS_HOST: redis
      REDIS_PORT: 6379

  db:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: dbname
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U user -d dbname']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: